name: Build and Publish .NET Backend

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore SAKAN.API/SAKAN.API.csproj

    - name: Publish API
      run: dotnet publish SAKAN.API/SAKAN.API.csproj -c Release -o ./publish_output

    - name: Upload Published Output
      uses: actions/upload-artifact@v4
      with:
        name: sakan-backend-published
        path: ./publish_output
